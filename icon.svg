<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c1118"/>
      <stop offset="1" stop-color="#05070b"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- neon grid floor -->
  <g stroke="#00f5ff" stroke-opacity="0.18" stroke-width="2">
    <line x1="0" y1="360" x2="512" y2="360"/>
    <line x1="0" y1="416" x2="512" y2="416"/>
    <line x1="0" y1="472" x2="512" y2="472"/>
    <line x1="96" y1="340" x2="40" y2="500"/>
    <line x1="256" y1="340" x2="256" y2="500"/>
    <line x1="416" y1="340" x2="472" y2="500"/>
  </g>
  <!-- pixel face -->
  <g filter="url(#glow)">
    <rect x="156" y="112" width="200" height="200" rx="14" fill="#0a0f16" stroke="#00f5ff" stroke-width="8"/>
    <rect x="188" y="176" width="40" height="40" fill="#39ff14"/>
    <rect x="284" y="176" width="40" height="40" fill="#39ff14"/>
    <rect x="200" y="188" width="16" height="16" fill="#0a0f16"/>
    <rect x="296" y="188" width="16" height="16" fill="#0a0f16"/>
    <rect x="208" y="252" width="96" height="20" fill="#00f5ff"/>
  </g>
  <text x="256" y="470" text-anchor="middle" font-family="monospace" font-size="40" fill="#00f5ff" opacity="0.9">3D</text>
</svg>
